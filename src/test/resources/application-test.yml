spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  thymeleaf:
    cache: false

farmchainx:
  admin:
    email: ${ADMIN_EMAIL:test-admin@farmchainx.local}
    password: ${ADMIN_PASSWORD:test-only-password}
    full-name: System Administrator
  upload:
    dir: ./test-uploads
  tracking:
    prefix: FCX

logging:
  level:
    com.farmchainx: WARN
    org.springframework.security: WARN
