spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmchainx}?createDatabaseIfNotExist=false&sslMode=${DB_SSL_MODE:VERIFY_IDENTITY}&serverTimezone=UTC"
    hikari:
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      connection-timeout: 30000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: strict

logging:
  level:
    root: INFO
    com.farmchainx: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
