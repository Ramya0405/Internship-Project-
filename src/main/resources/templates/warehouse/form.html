<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Warehouse Facility Form')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('wh-manage')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Warehouse Facility')}"></div>
        <div class="fcx-content">
            <div class="row"><div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0 fw-semibold"
                         th:text="${editMode} ? 'Edit Facility' : 'Register New Facility'">Facility Form</div>
                    <div class="card-body">
                        <form th:action="${editMode} ? @{/warehouse/manage/{id}/edit(id=${warehouseDto.id})} : @{/warehouse/manage/new}"
                              th:object="${warehouseDto}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label class="form-label small fw-medium">Warehouse Name *</label>
                                <input type="text" th:field="*{warehouseName}"
                                       th:classappend="${#fields.hasErrors('warehouseName')} ? 'is-invalid'"
                                       class="form-control" placeholder="Central Cold Storage #1"/>
                                <div class="invalid-feedback" th:errors="*{warehouseName}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-medium">Location *</label>
                                <input type="text" th:field="*{location}"
                                       th:classappend="${#fields.hasErrors('location')} ? 'is-invalid'"
                                       class="form-control" placeholder="Industrial Area, Sector 5"/>
                                <div class="invalid-feedback" th:errors="*{location}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-medium">Capacity (Tons)</label>
                                <input type="number" step="0.1" th:field="*{capacityTons}" class="form-control" placeholder="e.g. 500"/>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn fcx-btn-primary"
                                        th:text="${editMode} ? 'Update Facility' : 'Register Facility'">Submit</button>
                                <a th:href="@{/warehouse/manage}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
