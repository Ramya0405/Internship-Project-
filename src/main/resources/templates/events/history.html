<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Supply Chain History')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Supply Chain History')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="row g-3">
                <!-- Batch info -->
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm mb-3">
                        <div class="card-header bg-transparent border-0 fw-semibold">Batch Info</div>
                        <div class="card-body small">
                            <p class="mb-1"><strong>Tracking ID:</strong> <code th:text="${batch.trackingId}"></code></p>
                            <p class="mb-1"><strong>Product:</strong> <span th:text="${batch.productName}">-</span></p>
                            <p class="mb-1"><strong>Status:</strong>
                                <span class="badge" th:classappend="'fcx-badge-' + ${batch.currentStatus.name().toLowerCase().replace('_','-')}"
                                      th:text="${batch.currentStatus.name().replace('_',' ')}"></span>
                            </p>
                        </div>
                    </div>

                    <!-- Add event form -->
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-transparent border-0 fw-semibold small">Add Event</div>
                        <div class="card-body">
                            <form th:action="@{/events/batch/{id}/add(id=${batch.id})}"
                                  th:object="${eventDto}" method="post" novalidate>
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input type="hidden" th:field="*{batchId}"/>
                                <div class="mb-2">
                                    <select th:field="*{eventType}" class="form-select form-select-sm">
                                        <option value="">-- Event Type --</option>
                                        <option th:each="t : ${eventTypes}" th:value="${t}"
                                                th:text="${t.name().replace('_',' ')}"></option>
                                    </select>
                                </div>
                                <div class="mb-2">
                                    <input type="text" th:field="*{location}" class="form-control form-control-sm" placeholder="Location"/>
                                </div>
                                <div class="mb-2">
                                    <input type="number" step="0.1" th:field="*{temperature}" class="form-control form-control-sm" placeholder="Temp (°C)"/>
                                </div>
                                <div class="mb-2">
                                    <input type="number" step="0.1" th:field="*{humidity}" class="form-control form-control-sm" placeholder="Humidity (%)"/>
                                </div>
                                <div class="mb-2">
                                    <textarea th:field="*{description}" class="form-control form-control-sm" rows="2" placeholder="Description"></textarea>
                                </div>
                                <button type="submit" class="btn fcx-btn-primary btn-sm w-100">
                                    <i class="fa fa-plus me-1"></i>Record Event
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="col-md-8">
                    <h6 class="fcx-section-header">Supply Chain Timeline</h6>
                    <div th:if="${events.isEmpty()}" class="text-muted text-center py-4">
                        <i class="fa fa-history" style="font-size:2rem;"></i>
                        <p class="mt-2">No events recorded yet.</p>
                    </div>
                    <div class="timeline">
                        <div th:each="e : ${events}" class="timeline-item">
                            <div class="timeline-dot"></div>
                            <div class="timeline-content">
                                <div class="d-flex justify-content-between">
                                    <span class="fw-semibold small" th:text="${e.eventType.name().replace('_',' ')}">Event</span>
                                    <span class="text-muted small" th:text="${#temporals.format(e.eventTimestamp,'dd MMM yyyy HH:mm')}">-</span>
                                </div>
                                <div class="small text-muted" th:if="${e.location}"><i class="fa fa-map-marker-alt me-1"></i><span th:text="${e.location}"></span></div>
                                <div class="small" th:if="${e.description}" th:text="${e.description}"></div>
                                <div class="small text-muted mt-1">
                                    <span th:if="${e.temperature != null}"><i class="fa fa-thermometer-half me-1"></i><span th:text="${e.temperature}"></span>°C &nbsp;</span>
                                    <span th:if="${e.humidity != null}"><i class="fa fa-tint me-1"></i><span th:text="${e.humidity}"></span>%</span>
                                </div>
                                <div class="small text-muted" th:if="${e.updatedByName}">by <span th:text="${e.updatedByName}"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
