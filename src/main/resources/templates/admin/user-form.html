<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Create User')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('admin-users')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Create User')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="row"><div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0 fw-semibold">Create Account</div>
                    <div class="card-body">
                        <form th:action="@{/admin/users/new}" th:object="${adminUserRequest}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label for="fullName" class="form-label small fw-medium">Full Name *</label>
                                <input id="fullName" type="text" th:field="*{fullName}"
                                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                       class="form-control"/>
                                <div class="invalid-feedback" th:errors="*{fullName}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label small fw-medium">Email Address *</label>
                                <input id="email" type="email" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       class="form-control"/>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="phoneNumber" class="form-label small fw-medium">Phone Number</label>
                                <input id="phoneNumber" type="tel" th:field="*{phoneNumber}"
                                       th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                                       class="form-control"/>
                                <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="role" class="form-label small fw-medium">Role *</label>
                                <select id="role" th:field="*{role}"
                                        th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'"
                                        class="form-select">
                                    <option value="">-- Select role --</option>
                                    <option th:each="role : ${roles}" th:value="${role}"
                                            th:text="${#strings.replace(role.name(), '_', ' ')}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{role}"></div>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label small fw-medium">Password *</label>
                                <input id="password" type="password" th:field="*{password}"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       class="form-control" autocomplete="new-password"/>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                                <div class="form-text">At least 8 characters, including uppercase, lowercase, and a digit.</div>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label small fw-medium">Confirm Password *</label>
                                <input id="confirmPassword" type="password" th:field="*{confirmPassword}"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                       class="form-control" autocomplete="new-password"/>
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn fcx-btn-primary">Create User</button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
