<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('User Management')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('admin-users')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('User Management')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">All Users</span>
                    <a th:href="@{/admin/users/new}" class="btn fcx-btn-primary btn-sm"><i class="fa fa-plus me-1"></i>Add User</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr>
                                <th>#</th><th>Full Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Joined</th><th>Actions</th>
                            </tr></thead>
                            <tbody>
                            <tr th:if="${users == null or users.isEmpty()}">
                                <td colspan="7" class="text-center text-muted py-3">No users found.</td>
                            </tr>
                            <tr th:each="u, i : ${users}">
                                <td th:text="${users.number * users.size + i.index + 1}">1</td>
                                <td th:text="${u.fullName}">-</td>
                                <td th:text="${u.email}">-</td>
                                <td><span class="badge bg-secondary" th:text="${u.role}"></span></td>
                                <td th:text="${u.phoneNumber ?: '-'}">-</td>
                                <td th:text="${#temporals.format(u.createdAt,'dd MMM yyyy')}">-</td>
                                <td>
                                    <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                          onsubmit="return confirm('Delete this user?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                        <button type="submit" class="btn btn-danger btn-sm"><i class="fa fa-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <div th:replace="~{fragments/layout :: pagination(${users}, '/admin/users')}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
