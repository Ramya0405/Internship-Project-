<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('admin-dashboard')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Admin Dashboard')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- ── Stats cards ─────────────────────────────────────────── -->
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-3">
                    <div class="fcx-stat-card" style="background:#e8f5e9;">
                        <div class="stat-icon" style="background:#c8e6c9;color:#2e7d32;"><i class="fa fa-users"></i></div>
                        <div>
                            <div class="stat-value" th:text="${totalUsers}">0</div>
                            <div class="stat-label">Total Users</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="fcx-stat-card" style="background:#e3f2fd;">
                        <div class="stat-icon" style="background:#bbdefb;color:#1565c0;"><i class="fa fa-tractor"></i></div>
                        <div>
                            <div class="stat-value" th:text="${totalFarms}">0</div>
                            <div class="stat-label">Registered Farms</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="fcx-stat-card" style="background:#fff8e1;">
                        <div class="stat-icon" style="background:#ffecb3;color:#e65100;"><i class="fa fa-boxes"></i></div>
                        <div>
                            <div class="stat-value" th:text="${totalBatches}">0</div>
                            <div class="stat-label">Product Batches</div>
                        </div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-3">
                    <div class="fcx-stat-card" style="background:#ffebee;">
                        <div class="stat-icon" style="background:#ffcdd2;color:#c62828;"><i class="fa fa-exclamation-triangle"></i></div>
                        <div>
                            <div class="stat-value" th:text="${recalledCount}">0</div>
                            <div class="stat-label">Recalled Batches</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Role breakdown ──────────────────────────────────────── -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-transparent border-0 fw-semibold">User Breakdown by Role</div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr><td><i class="fa fa-seedling text-success me-2"></i>Farmers</td>      <td class="fw-bold" th:text="${farmerCount}">0</td></tr>
                                <tr><td><i class="fa fa-truck text-primary me-2"></i>Distributors</td>   <td class="fw-bold" th:text="${distributorCount}">0</td></tr>
                                <tr><td><i class="fa fa-truck text-warning me-2"></i>In Transit</td>     <td class="fw-bold" th:text="${inTransitCount}">0</td></tr>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-header bg-transparent border-0 fw-semibold">Quick Actions</div>
                        <div class="card-body d-flex flex-wrap gap-2">
                            <a th:href="@{/admin/users}"   class="btn fcx-btn-primary btn-sm"><i class="fa fa-users me-1"></i>Manage Users</a>
                            <a th:href="@{/admin/batches}" class="btn btn-outline-secondary btn-sm"><i class="fa fa-boxes me-1"></i>All Batches</a>
                            <a th:href="@{/ai/dashboard}"  class="btn btn-outline-warning btn-sm"><i class="fa fa-robot me-1"></i>AI Alerts</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Recent batches ──────────────────────────────────────── -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Recent Batches</span>
                    <a th:href="@{/admin/batches}" class="btn btn-sm fcx-btn-primary">View All</a>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr>
                                <th>Tracking ID</th><th>Product</th><th>Farm</th>
                                <th>Farmer</th><th>Status</th><th>Created</th>
                            </tr></thead>
                            <tbody>
                            <tr th:if="${recentBatches == null or recentBatches.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-3">No batches yet.</td>
                            </tr>
                            <tr th:each="b : ${recentBatches}">
                                <td><code th:text="${b.trackingId}"></code></td>
                                <td th:text="${b.productName}">-</td>
                                <td th:text="${b.farmName}">-</td>
                                <td th:text="${b.farmerName}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="'fcx-badge-' + ${b.currentStatus.name().toLowerCase().replace('_','-')}"
                                          th:text="${b.currentStatus.name().replace('_',' ')}"></span>
                                </td>
                                <td th:text="${#temporals.format(b.createdAt,'dd MMM yyyy')}">-</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
