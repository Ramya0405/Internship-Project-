<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Retailer Inventory')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('ret-batches')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Retailer Inventory')}"></div>
        <div class="fcx-content">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr><th>Tracking ID</th><th>Product</th><th>Farm</th><th>Qty (kg)</th><th>Expiry</th><th>Actions</th></tr></thead>
                            <tbody>
                            <tr th:if="${batches.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">No inventory.</td></tr>
                            <tr th:each="b : ${batches}">
                                <td><code th:text="${b.trackingId}"></code></td>
                                <td th:text="${b.productName}">-</td>
                                <td th:text="${b.farmName}">-</td>
                                <td th:text="${b.quantity}">-</td>
                                <td th:text="${b.expiryDate ?: 'N/A'}">-</td>
                                <td><a th:href="@{/track(id=${b.trackingId})}" class="btn btn-sm btn-outline-primary"><i class="fa fa-search"></i></a></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <div th:replace="~{fragments/layout :: pagination(${batches}, '/retailer/batches')}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
