<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Page Not Found – FarmChainX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/farmchainx.css}" rel="stylesheet"/>
</head>
<body class="fcx-auth-bg d-flex align-items-center justify-content-center min-vh-100">
<div class="text-center p-4">
    <div class="mb-3 text-success">
        <i class="fa fa-compass" style="font-size:4.5rem; opacity:0.8;"></i>
    </div>
    <h1 class="display-5 fw-bold text-dark">404 – Page Not Found</h1>
    <p class="text-muted mt-2 mb-4" style="max-width:480px; margin:auto;">
        The agricultural traceability resource or page you are looking for does not exist or has been moved.
    </p>
    <div class="d-flex justify-content-center gap-2">
        <a th:href="@{/dashboard}" class="btn fcx-btn-primary px-4">
            <i class="fa fa-home me-2"></i>Dashboard
        </a>
        <a th:href="@{/track}" class="btn btn-outline-secondary px-4">
            <i class="fa fa-search me-2"></i>Track Product
        </a>
    </div>
</div>
</body>
</html>
