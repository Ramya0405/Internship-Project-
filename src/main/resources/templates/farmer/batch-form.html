<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Create Batch')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('batches')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Create Product Batch')}"></div>
        <div class="fcx-content">
            <div class="row"><div class="col-md-9 col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0 fw-semibold">New Agricultural Batch</div>
                    <div class="card-body">
                        <form th:action="@{/farmer/batches/new}" th:object="${batchDto}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Product *</label>
                                    <select th:field="*{productId}"
                                            th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"
                                            class="form-select">
                                        <option value="">-- Select product --</option>
                                        <option th:each="p : ${products}" th:value="${p.id}"
                                                th:text="${p.productName} + ' (' + ${p.category} + ')'"></option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{productId}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Farm *</label>
                                    <select th:field="*{farmId}"
                                            th:classappend="${#fields.hasErrors('farmId')} ? 'is-invalid'"
                                            class="form-select">
                                        <option value="">-- Select farm --</option>
                                        <option th:each="f : ${farms}" th:value="${f.id}" th:text="${f.farmName}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{farmId}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Quantity (kg) *</label>
                                    <input type="number" step="0.01" th:field="*{quantity}"
                                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                           class="form-control" placeholder="e.g. 500"/>
                                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Harvest Date *</label>
                                    <input type="date" th:field="*{harvestDate}"
                                           th:classappend="${#fields.hasErrors('harvestDate')} ? 'is-invalid'"
                                           class="form-control"/>
                                    <div class="invalid-feedback" th:errors="*{harvestDate}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Expiry Date</label>
                                    <input type="date" th:field="*{expiryDate}" class="form-control"/>
                                </div>
                            </div>

                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn fcx-btn-primary">
                                    <i class="fa fa-seedling me-1"></i>Create Batch
                                </button>
                                <a th:href="@{/farmer/batches}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
