<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('My Farms')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('farms')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('My Farms')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="d-flex justify-content-end mb-3">
                <a th:href="@{/farmer/farms/new}" class="btn fcx-btn-primary btn-sm">
                    <i class="fa fa-plus me-1"></i>Register Farm
                </a>
            </div>
            <div class="row g-3">
                <div th:if="${farms.isEmpty()}" class="col-12">
                    <div class="card border-0 shadow-sm text-center py-5">
                        <i class="fa fa-tractor text-muted" style="font-size:3rem;"></i>
                        <p class="mt-3 text-muted">No farms registered yet. <a th:href="@{/farmer/farms/new}">Register your first farm.</a></p>
                    </div>
                </div>
                <div th:each="f : ${farms}" class="col-md-6 col-xl-4">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body">
                            <h6 class="fw-bold mb-1" th:text="${f.farmName}">Farm Name</h6>
                            <p class="text-muted small mb-1"><i class="fa fa-map-marker-alt me-1"></i><span th:text="${f.location}">Location</span></p>
                            <p class="text-muted small mb-1" th:if="${f.farmSize != null}"><i class="fa fa-ruler me-1"></i><span th:text="${f.farmSize}">0</span> acres</p>
                            <p class="text-muted small mb-2" th:if="${f.certification != null}"><i class="fa fa-certificate me-1 text-warning"></i><span th:text="${f.certification}">-</span></p>
                        </div>
                        <div class="card-footer bg-transparent d-flex gap-2">
                            <a th:href="@{/farmer/farms/{id}/edit(id=${f.id})}" class="btn btn-sm btn-outline-primary flex-fill">
                                <i class="fa fa-edit me-1"></i>Edit
                            </a>
                            <form th:action="@{/farmer/farms/{id}/delete(id=${f.id})}" method="post"
                                  class="flex-fill" onsubmit="return confirm('Delete this farm?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="fa fa-trash me-1"></i>Delete
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
