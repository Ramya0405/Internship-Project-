<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Distributor Dashboard')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dist-dashboard')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Distributor Dashboard')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-4">
                    <div class="fcx-stat-card" style="background:#fff8e1;">
                        <div class="stat-icon" style="background:#ffecb3;color:#e65100;"><i class="fa fa-truck"></i></div>
                        <div><div class="stat-value" th:text="${inTransitCount}">0</div><div class="stat-label">Batches In Transit</div></div>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mb-3">
                <a th:href="@{/distributor/transportation/new}" class="btn fcx-btn-primary btn-sm"><i class="fa fa-plus me-1"></i>New Transportation</a>
                <a th:href="@{/distributor/batches}" class="btn btn-outline-secondary btn-sm"><i class="fa fa-list me-1"></i>View Batches</a>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent border-0 fw-semibold">Batches Currently In Transit</div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr><th>Tracking ID</th><th>Product</th><th>Farm</th><th>Qty (kg)</th><th>Actions</th></tr></thead>
                            <tbody>
                            <tr th:if="${inTransitBatches.isEmpty()}"><td colspan="5" class="text-center text-muted py-3">No batches in transit.</td></tr>
                            <tr th:each="b : ${inTransitBatches}">
                                <td><code th:text="${b.trackingId}"></code></td>
                                <td th:text="${b.productName}">-</td>
                                <td th:text="${b.farmName}">-</td>
                                <td th:text="${b.quantity}">-</td>
                                <td><a th:href="@{/events/batch/{id}(id=${b.id})}" class="btn btn-sm btn-outline-primary"><i class="fa fa-history"></i></a></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
