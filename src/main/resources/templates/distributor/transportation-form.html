<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Transportation Form')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('dist-dashboard')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Transportation Record')}"></div>
        <div class="fcx-content">
            <div class="row"><div class="col-md-8">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0 fw-semibold"
                         th:text="${editMode} ? 'Update Transportation' : 'Transportation Details'">Transportation Details</div>
                    <div class="card-body">
                        <form th:action="${editMode} ? @{/distributor/transportation/{id}/edit(id=${transportationDto.id})} : @{/distributor/transportation/new}"
                              th:object="${transportationDto}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="row g-3">
                                <div class="col-md-6" th:unless="${editMode}">
                                    <label class="form-label small fw-medium">Batch ID *</label>
                                    <input type="number" th:field="*{batchId}"
                                           th:classappend="${#fields.hasErrors('batchId')} ? 'is-invalid'"
                                           class="form-control" placeholder="Batch ID"/>
                                    <div class="invalid-feedback" th:errors="*{batchId}"></div>
                                </div>
                                <div class="col-md-6" th:if="${editMode}">
                                    <label class="form-label small fw-medium">Batch</label>
                                    <p class="form-control-plaintext"><code th:text="${transportationDto.trackingId}">Tracking ID</code></p>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-medium">Vehicle Number</label>
                                    <input type="text" th:field="*{vehicleNumber}" class="form-control" placeholder="e.g. MH12AB1234"/>
                                </div>
                                <div class="col-md-6" th:unless="${editMode}">
                                    <label class="form-label small fw-medium">Source Location *</label>
                                    <input type="text" th:field="*{sourceLocation}"
                                           th:classappend="${#fields.hasErrors('sourceLocation')} ? 'is-invalid'"
                                           class="form-control" placeholder="Origin location"/>
                                    <div class="invalid-feedback" th:errors="*{sourceLocation}"></div>
                                </div>
                                <div class="col-md-6" th:unless="${editMode}">
                                    <label class="form-label small fw-medium">Destination Location *</label>
                                    <input type="text" th:field="*{destinationLocation}"
                                           th:classappend="${#fields.hasErrors('destinationLocation')} ? 'is-invalid'"
                                           class="form-control" placeholder="Destination location"/>
                                    <div class="invalid-feedback" th:errors="*{destinationLocation}"></div>
                                </div>
                                <div class="col-md-6" th:if="${editMode}">
                                    <label class="form-label small fw-medium">Route</label>
                                    <p class="form-control-plaintext">
                                        <span th:text="${transportationDto.sourceLocation}">Origin</span>
                                        &rarr;
                                        <span th:text="${transportationDto.destinationLocation}">Destination</span>
                                    </p>
                                </div>
                                <div class="col-md-6" th:unless="${editMode}">
                                    <label class="form-label small fw-medium">Departure Date &amp; Time</label>
                                    <input type="datetime-local" th:field="*{departureDate}" class="form-control"/>
                                </div>
                                <div class="col-md-6" th:unless="${editMode}">
                                    <label class="form-label small fw-medium">Estimated Arrival</label>
                                    <input type="datetime-local" th:field="*{estimatedArrival}" class="form-control"/>
                                </div>
                                <div class="col-md-6" th:if="${editMode}">
                                    <label class="form-label small fw-medium">Transportation Status</label>
                                    <select th:field="*{transportationStatus}" class="form-select">
                                        <option th:each="status : ${statusValues}" th:value="${status}"
                                                th:text="${status.name().replace('_',' ')}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6" th:if="${editMode}">
                                    <label class="form-label small fw-medium">Actual Arrival</label>
                                    <input type="datetime-local" th:field="*{actualArrival}" class="form-control"/>
                                </div>
                                <div class="col-12">
                                    <label class="form-label small fw-medium">Notes</label>
                                    <textarea th:field="*{notes}" class="form-control" rows="2"></textarea>
                                </div>
                            </div>
                            <div class="d-flex gap-2 mt-4">
                                <button type="submit" class="btn fcx-btn-primary"
                                        th:text="${editMode} ? 'Save Changes' : 'Create Record'">
                                    <i class="fa fa-truck me-1"></i>Create Record
                                </button>
                                <a th:href="@{/distributor/dashboard}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
