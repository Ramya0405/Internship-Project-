<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Quality Inspections')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Quality Inspections')}"></div>
        <div class="fcx-content">
            <div class="mb-3 small text-muted">
                Batch: <strong th:text="${batch.trackingId}">-</strong> &mdash; <span th:text="${batch.productName}">-</span>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr><th>Date</th><th>Grade</th><th>Temp (°C)</th><th>Humidity (%)</th><th>Inspector</th><th>Notes</th></tr></thead>
                            <tbody>
                            <tr th:if="${inspections.isEmpty()}"><td colspan="6" class="text-center text-muted py-4">No inspections recorded.</td></tr>
                            <tr th:each="qi : ${inspections}">
                                <td th:text="${qi.inspectionDate}">-</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${qi.qualityGrade.name() == 'REJECTED'} ? 'bg-danger' : (${qi.qualityGrade.name() == 'A_PLUS' or qi.qualityGrade.name() == 'A'} ? 'bg-success' : 'bg-warning text-dark')"
                                          th:text="${qi.qualityGrade}"></span>
                                </td>
                                <td th:text="${qi.temperature ?: '-'}">-</td>
                                <td th:text="${qi.humidity ?: '-'}">-</td>
                                <td th:text="${qi.inspectedByName ?: '-'}">-</td>
                                <td class="small text-muted" th:text="${#strings.abbreviate(qi.inspectionNotes ?: '-', 50)}">-</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
