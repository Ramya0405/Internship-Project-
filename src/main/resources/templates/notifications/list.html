<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Notification Center')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="text-muted small">Stay updated on your product batches, dispatches, and risk alerts.</span>
                <form th:action="@{/notifications/read-all}" method="post" th:if="${unreadCount != null and unreadCount > 0}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm btn-outline-success">
                        <i class="fa fa-check-double me-1"></i>Mark All Read
                    </button>
                </form>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="list-group list-group-flush">
                        <div th:if="${notifications.isEmpty()}" class="text-center text-muted py-5">
                            <i class="fa fa-bell-slash" style="font-size:2.5rem;"></i>
                            <p class="mt-2 mb-0">No notifications at this time.</p>
                        </div>
                        <div th:each="n : ${notifications}" class="list-group-item p-3"
                             th:classappend="${!n.isRead} ? 'bg-light border-start border-3 border-success' : ''">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="d-flex gap-3 align-items-start">
                                    <span class="badge mt-1"
                                          th:classappend="${n.notificationType.name() == 'ALERT'} ? 'bg-danger' : (${n.notificationType.name() == 'WARNING'} ? 'bg-warning text-dark' : 'bg-primary')"
                                          th:text="${n.notificationType}">INFO</span>
                                    <div>
                                        <p class="mb-1" th:classappend="${!n.isRead} ? 'fw-semibold text-dark' : 'text-secondary'"
                                           th:text="${n.message}">Notification message</p>
                                        <small class="text-muted">
                                            <i class="fa fa-clock me-1"></i>
                                            <span th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy HH:mm')}">-</span>
                                        </small>
                                    </div>
                                </div>
                                <span th:if="${!n.isRead}" class="badge bg-success bg-opacity-10 text-success small">New</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-transparent" th:if="${!notifications.isEmpty()}">
                    <div th:replace="~{fragments/layout :: pagination(${notifications}, '/notifications')}"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
