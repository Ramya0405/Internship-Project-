<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Product Form')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('products')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('Product Form')}"></div>
        <div class="fcx-content">
            <div class="row"><div class="col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-transparent border-0 fw-semibold"
                         th:text="${editMode} ? 'Edit Product' : 'Add Product'">Product Form</div>
                    <div class="card-body">
                        <form th:action="${editMode} ? @{/products/{id}/edit(id=${productDto.id})} : @{/products/new}"
                              th:object="${productDto}" method="post" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <div class="mb-3">
                                <label class="form-label small fw-medium">Product Name *</label>
                                <input type="text" th:field="*{productName}"
                                       th:classappend="${#fields.hasErrors('productName')} ? 'is-invalid'"
                                       class="form-control" placeholder="e.g. Tomato"/>
                                <div class="invalid-feedback" th:errors="*{productName}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-medium">Category *</label>
                                <input type="text" th:field="*{category}"
                                       th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                       class="form-control" placeholder="e.g. Vegetable, Grain, Fruit"/>
                                <div class="invalid-feedback" th:errors="*{category}"></div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-medium">Description</label>
                                <textarea th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Optional product description"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn fcx-btn-primary"
                                        th:text="${editMode} ? 'Update Product' : 'Add Product'">Submit</button>
                                <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div></div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
