<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('AI Risk Dashboard')}"></head>
<body>
<div class="fcx-wrapper">
    <div th:replace="~{fragments/layout :: sidebar('ai')}"></div>
    <div class="fcx-main">
        <div th:replace="~{fragments/layout :: topbar('AI Risk Analysis Dashboard')}"></div>
        <div class="fcx-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <!-- Risk summary cards -->
            <div class="row g-3 mb-4">
                <div class="col-sm-4">
                    <div class="fcx-stat-card" style="background:#ffebee;">
                        <div class="stat-icon" style="background:#ffcdd2;color:#c62828;"><i class="fa fa-exclamation-triangle"></i></div>
                        <div><div class="stat-value" th:text="${highCount}">0</div><div class="stat-label">HIGH Risk</div></div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="fcx-stat-card" style="background:#fff8e1;">
                        <div class="stat-icon" style="background:#ffecb3;color:#e65100;"><i class="fa fa-exclamation-circle"></i></div>
                        <div><div class="stat-value" th:text="${mediumCount}">0</div><div class="stat-label">MEDIUM Risk</div></div>
                    </div>
                </div>
                <div class="col-sm-4">
                    <div class="fcx-stat-card" style="background:#e8f5e9;">
                        <div class="stat-icon" style="background:#c8e6c9;color:#2e7d32;"><i class="fa fa-check-circle"></i></div>
                        <div><div class="stat-value" th:text="${lowCount}">0</div><div class="stat-label">LOW Risk</div></div>
                    </div>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-header bg-transparent border-0 fw-semibold">
                    <i class="fa fa-exclamation-triangle text-danger me-2"></i>HIGH Risk Batches
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover fcx-table mb-0">
                            <thead><tr>
                                <th>Tracking ID</th><th>Risk Score</th><th>Level</th>
                                <th>Anomalies</th><th>Analyzed At</th><th>Actions</th>
                            </tr></thead>
                            <tbody>
                            <tr th:if="${highRiskAlerts.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-4">
                                    <i class="fa fa-check-circle text-success me-2"></i>No HIGH risk batches detected.
                                </td>
                            </tr>
                            <tr th:each="a : ${highRiskAlerts}">
                                <td><code th:text="${a.trackingId}"></code></td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="progress flex-grow-1" style="height:8px;">
                                            <div class="progress-bar bg-danger" th:style="'width:' + ${a.riskScore} + '%'"></div>
                                        </div>
                                        <span class="fw-bold text-danger" th:text="${a.riskScore} + '/100'"></span>
                                    </div>
                                </td>
                                <td><span class="badge fcx-badge-high" th:text="${a.riskLevel}"></span></td>
                                <td class="small" th:text="${#lists.isEmpty(a.detectedAnomalies)} ? 'None' : #strings.abbreviate(#strings.listJoin(a.detectedAnomalies, '; '), 80)">-</td>
                                <td class="small" th:text="${#temporals.format(a.analyzedAt,'dd MMM HH:mm')}">-</td>
                                <td>
                                    <a th:href="@{/ai/batch/{id}(id=${a.batchId})}" class="btn btn-sm btn-outline-danger">
                                        <i class="fa fa-search"></i>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
