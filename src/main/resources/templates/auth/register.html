<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register – FarmChainX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/farmchainx.css}" rel="stylesheet"/>
</head>
<body class="fcx-auth-bg">

<div class="container py-5">
    <div class="row">
        <div class="col-md-7 col-lg-6 mx-auto">

            <div class="text-center mb-4">
                <h2 class="fcx-brand">FarmChainX</h2>
                <p class="text-muted small">Create your account</p>
            </div>

            <div class="card shadow-sm border-0 fcx-card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4 fw-semibold">New Account</h5>

                    <form th:action="@{/register}" th:object="${registrationRequest}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label small fw-medium">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}"
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                                   class="form-control" placeholder="John Doe"/>
                            <div class="invalid-feedback" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-medium">Email Address</label>
                            <input type="email" id="email" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                   class="form-control" placeholder="your@email.com"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label small fw-medium">Phone Number <span class="text-muted">(optional)</span></label>
                            <input type="tel" id="phoneNumber" th:field="*{phoneNumber}"
                                   th:classappend="${#fields.hasErrors('phoneNumber')} ? 'is-invalid'"
                                   class="form-control" placeholder="+1 555 000 0000"/>
                            <div class="invalid-feedback" th:errors="*{phoneNumber}"></div>
                        </div>

                        <div class="mb-3">
                            <span class="form-text">New accounts are registered as consumers. Other roles require administrator approval.</span>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-medium">Password</label>
                            <input type="password" id="password" th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                   class="form-control" placeholder="Min. 8 characters"/>
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                            <div class="form-text small">Must include uppercase, lowercase, and a digit.</div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label small fw-medium">Confirm Password</label>
                            <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                                   class="form-control" placeholder="Re-enter password"/>
                            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn fcx-btn-primary">
                                <i class="fa fa-user-plus me-2"></i>Create Account
                            </button>
                        </div>
                    </form>

                    <hr class="my-3"/>
                    <p class="text-center small mb-0">
                        Already have an account?
                        <a th:href="@{/login}" class="fcx-link">Sign in</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
