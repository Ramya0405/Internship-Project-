<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login – FarmChainX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
    <link th:href="@{/css/farmchainx.css}" rel="stylesheet"/>
</head>
<body class="fcx-auth-bg">

<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
        <div class="col-md-5 col-lg-4 mx-auto">

            <!-- Brand -->
            <div class="text-center mb-4">
                <img th:src="@{/images/logo.png}" src="/images/logo.png"
                     onerror="this.style.display='none'" alt="FarmChainX" height="60"/>
                <h2 class="fcx-brand mt-2">FarmChainX</h2>
                <p class="text-muted small">AI-Driven Agricultural Traceability</p>
            </div>

            <div class="card shadow-sm border-0 fcx-card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4 fw-semibold">Sign In</h5>

                    <!-- Alerts -->
                    <div th:if="${errorMsg}"   class="alert alert-danger small py-2" th:text="${errorMsg}"></div>
                    <div th:if="${logoutMsg}"  class="alert alert-success small py-2" th:text="${logoutMsg}"></div>
                    <div th:if="${expiredMsg}" class="alert alert-warning small py-2" th:text="${expiredMsg}"></div>
                    <div th:if="${successMsg}" class="alert alert-success small py-2" th:text="${successMsg}"></div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="email" class="form-label small fw-medium">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-envelope text-muted"></i></span>
                                <input type="email" id="email" name="email" class="form-control"
                                       placeholder="your@email.com" required autofocus/>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label small fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fa fa-lock text-muted"></i></span>
                                <input type="password" id="password" name="password" class="form-control"
                                       placeholder="Enter password" required/>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn fcx-btn-primary">
                                <i class="fa fa-sign-in-alt me-2"></i>Sign In
                            </button>
                        </div>
                    </form>

                    <hr class="my-3"/>
                    <p class="text-center small mb-0">
                        Don't have an account?
                        <a th:href="@{/register}" class="fcx-link">Create one</a>
                    </p>
                    <p class="text-center small mb-0 mt-1">
                        <a th:href="@{/track}" class="fcx-link">
                            <i class="fa fa-search me-1"></i>Track a product without logging in
                        </a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
